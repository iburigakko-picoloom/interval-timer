<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f4f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>インターバルタイマー</title>

  <style>
    :root {
      --bg: #f4f4f5;
      --panel: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --line: #d4d4d8;
      --blue: #1d4ed8;
      --blueWeak: #eff6ff;
      --green: #15803d;
      --greenWeak: #f0fdf4;
      --orange: #b45309;
      --orangeWeak: #fffbeb;
      --red: #dc2626;
      --shadow: none;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-text-size-adjust: 100%;
      -webkit-overflow-scrolling: touch;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(37, 99, 235, .28);
      outline-offset: 2px;
    }

    button:disabled {
      cursor: default;
      opacity: .38;
    }

    input {
      -webkit-tap-highlight-color: transparent;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 80px);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 0 10px;
      margin-bottom: 10px;
      background: linear-gradient(180deg, rgba(247, 251, 255, .96), rgba(247, 251, 255, .88));
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 4px;
      font-size: 11px;
      color: var(--blue);
      font-weight: 900;
      letter-spacing: .06em;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.03em;
    }

    h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    h3 {
      margin: 0;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .hidden {
      display: none !important;
    }

    .panel,
    .home-saved-button,
    .mock-phone-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .panel,
    .mock-phone-card {
      width: 100%;
      padding: 16px;
      margin-bottom: 14px;
    }

    .mock-phone-card {
      border-radius: 28px;
      box-shadow: 0 14px 34px rgba(15, 23, 42, .10);
    }

    .home-title-row {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 16px;
    }

    .home-title-row h2 {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-row {
      width: 100%;
      display: grid;
      grid-template-columns: 36px 1fr auto 14px;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      padding: 8px 10px;
      border: 1px solid #dfe7f3;
      border-radius: 13px;
      background: #ffffff;
      box-shadow: 0 3px 10px rgba(15, 23, 42, .035);
      text-align: left;
    }

    .row-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: #ffffff;
      font-size: 17px;
      font-weight: 900;
    }

    .blue-icon {
      background: #3b82f6;
    }

    .green-icon {
      background: #43bf5f;
    }

    .orange-icon {
      background: #f58220;
    }

    .row-label {
      font-size: 15px;
      font-weight: 900;
      color: #111827;
    }

    .row-value {
      font-size: 15px;
      font-weight: 900;
      color: #111827;
    }

    .chev {
      color: #6b7280;
      font-size: 22px;
      line-height: 1;
    }

    .big-start {
      width: 100%;
      min-height: 66px;
      margin-top: 18px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(180deg, #3b82f6, #2563eb);
      color: #ffffff;
      font-size: 23px;
      font-weight: 900;
      box-shadow: 0 10px 22px rgba(37, 99, 235, .26);
    }

    .home-saved-button {
      width: 100%;
      min-height: 52px;
      display: grid;
      grid-template-columns: 38px 1fr auto 16px;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding: 9px 10px;
      text-align: left;
      background: #ffffff;
    }

    .home-saved-button .row-icon {
      width: 34px;
      height: 34px;
    }

    .home-saved-button small {
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .sound-card {
      width: 100%;
      display: grid;
      grid-template-columns: 38px 1fr;
      align-items: start;
      gap: 10px;
      margin-top: 12px;
      padding: 12px 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .sound-card .row-icon {
      width: 34px;
      height: 34px;
    }

    .sound-card-main {
      min-width: 0;
    }

    .sound-card-head,
    .sound-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sound-card-head {
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .sound-volume-value {
      color: var(--blue);
      font-size: 13px;
      font-weight: 900;
    }

    .sound-controls input[type="range"] {
      flex: 1;
      min-width: 0;
      padding: 0;
      accent-color: var(--blue);
    }

    .sound-test {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 7px 12px;
    }

    .sound-hint {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label span {
      color: var(--muted);
      font-weight: 800;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fbfdff;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      width: 100%;
      min-height: 54px;
      border: none;
      border-radius: 16px;
      padding: 13px 16px;
      font-weight: 900;
      font-size: 16px;
    }

    .primary {
      background: var(--blue);
      color: white;
    }

    .secondary {
      background: var(--blueWeak);
      color: var(--blue);
    }

    .ghost {
      background: white;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 13px;
      background: #fcfdff;
    }

    .item-title {
      font-size: 17px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .small-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .small {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      padding: 9px 8px;
      font-size: 13.5px;
      font-weight: 900;
    }

    .small.blue {
      background: var(--blueWeak);
      color: var(--blue);
      border-color: transparent;
    }

    .small.green {
      background: var(--greenWeak);
      color: #15803d;
      border-color: transparent;
    }

    .small.red {
      background: #fff1f2;
      color: #be123c;
      border-color: transparent;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 16px;
      background: #fbfdff;
      color: var(--muted);
      text-align: center;
      font-weight: 800;
    }

    .edit-banner {
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 14px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      font-size: 14px;
      font-weight: 900;
      line-height: 1.45;
    }

    .edit-banner .edit-title {
      display: block;
      margin-bottom: 4px;
      color: #c2410c;
      font-size: 15px;
    }

    .two-actions {
      grid-template-columns: 1fr 1fr;
    }

    .combo-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .mini-head {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 900;
    }

    #availableList .item {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      align-items: center;
      column-gap: 8px;
      row-gap: 3px;
      padding: 8px 10px;
      min-height: 58px;
    }

    #availableList .item-title {
      grid-column: 1;
      grid-row: 1;
      margin-bottom: 0;
      font-size: 15px;
      line-height: 1.25;
    }

    #availableList .metrics {
      grid-column: 1;
      grid-row: 2;
      font-size: 12px;
      gap: 4px 8px;
      line-height: 1.25;
    }

    #availableList .small-actions {
      grid-column: 2;
      grid-row: 1 / span 2;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 0;
    }

    #availableList .small-actions .small {
      min-width: 56px;
      min-height: 36px;
      padding: 7px 9px;
    }

    .combo-total {
      margin-top: 10px;
      padding: 12px;
      border-radius: 14px;
      background: #f3f4f6;
      font-weight: 900;
      text-align: center;
      color: #111827;
    }

    .combo-total span {
      color: var(--blue);
      font-size: 18px;
    }

    .run-head {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 18px;
    }

    .tag {
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--blueWeak);
      color: var(--blue);
      font-weight: 900;
    }

    .ring-wrap {
      display: flex;
      justify-content: center;
      margin: 12px 0 18px;
    }

    .ring {
      --progress: 0;
      --phaseColor: var(--green);
      width: min(82vw, 330px);
      height: min(82vw, 330px);
      border-radius: 50%;
      background: conic-gradient(var(--phaseColor) calc(var(--progress) * 1%), #e6eef9 0%);
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .ring-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: white;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 20px;
    }

    .phase {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .time {
      font-size: clamp(56px, 17vw, 76px);
      font-weight: 900;
      line-height: 1;
    }

    .step {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      font-weight: 800;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .info {
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 16px;
    }

    .info span {
      display: block;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .info strong {
      font-size: 18px;
    }

    .upcoming-menus {
      margin-top: 10px;
    }

    .upcoming-title {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .upcoming-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .upcoming-list span {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 7px 10px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #111827;
      font-size: 13px;
      font-weight: 800;
    }

    .page-head-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    /* stable compact timer screen */
    body.run-screen .topbar {
      display: none;
    }

    body.run-screen .app {
      padding-top: 10px;
      padding-bottom: 24px;
      min-height: 100dvh;
      height: auto;
      overflow: visible;
    }

    body.run-screen main,
    body.run-screen #run {
      overflow: visible;
    }

    body.run-screen #run .panel {
      padding: 14px;
      margin-bottom: 0;
    }

    body.run-screen #blockNameTag {
      display: none !important;
    }

    body.run-screen .run-head {
      margin-bottom: 6px;
    }

    body.run-screen .run-head .eyebrow {
      margin-bottom: 2px;
    }

    body.run-screen .run-head h2 {
      font-size: 24px;
    }

    body.run-screen .ring-wrap {
      margin: 6px 0 10px;
    }

    body.run-screen .ring {
      width: min(67vw, 245px);
      height: min(67vw, 245px);
      padding: 12px;
    }

    body.run-screen .ring.is-paused {
      --phaseColor: #94a3b8 !important;
    }

    body.run-screen .ring-inner {
      padding: 16px;
    }

    body.run-screen .phase {
      font-size: 18px;
    }

    body.run-screen .time {
      font-size: clamp(44px, 14vw, 64px);
    }

    body.run-screen .step {
      font-size: 15px;
    }

    body.run-screen .info-grid {
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    body.run-screen .info {
      padding: 9px 10px;
      border-radius: 14px;
    }

    body.run-screen .info span {
      font-size: 12px;
      margin-bottom: 2px;
    }

    body.run-screen .info strong {
      font-size: 15px;
    }

    body.run-screen .run-actions {
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    body.run-screen .run-actions .btn {
      min-height: 46px;
      padding: 10px 12px;
    }

    body.run-screen .run-actions #skip {
      order: 1;
    }

    body.run-screen .run-actions #pause {
      order: 2;
    }

    body.run-screen .run-actions #stop {
      order: 3;
      grid-column: 1 / -1;
    }

    body.run-screen .upcoming-menus {
      margin-top: 8px;
    }

    body.run-screen .upcoming-title {
      font-size: 12px;
      margin-bottom: 5px;
    }

    body.run-screen .upcoming-list {
      gap: 5px;
    }

    body.run-screen .upcoming-list span {
      min-height: 26px;
      padding: 4px 8px;
      font-size: 12px;
    }

    body.home-screen .topbar {
      margin-bottom: 6px;
    }

    body.home-screen .mock-phone-card {
      padding: 14px;
      margin-bottom: 10px;
    }

    body.home-screen .home-title-row {
      margin-bottom: 12px;
    }

    body.home-screen .setting-row {
      min-height: 50px;
    }

    body.home-screen .big-start {
      min-height: 60px;
      margin-top: 14px;
    }

    body.home-screen .home-saved-button {
      min-height: 50px;
      margin-top: 10px;
    }

    body.home-screen .sound-card {
      margin-top: 10px;
    }

    /* calm, compact home layout */
    #homeBtn {
      width: auto;
      min-height: 42px;
      padding: 9px 14px;
      border-radius: 12px;
      font-size: 14px;
    }

    body.home-screen .app {
      max-width: 520px;
      padding-top: calc(env(safe-area-inset-top) + 10px);
      padding-bottom: calc(env(safe-area-inset-bottom) + 20px);
    }

    body.home-screen .topbar {
      position: static;
      padding: 0 2px 8px;
      margin-bottom: 4px;
      background: transparent;
      backdrop-filter: none;
    }

    body.home-screen .topbar .eyebrow,
    body.home-screen .home-title-row {
      display: none;
    }

    body.home-screen .topbar h1 {
      font-size: 20px;
    }

    body.home-screen .mock-phone-card {
      padding: 16px;
      margin-bottom: 0;
      border-radius: 18px;
      border-color: #dfe7f1;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .06);
    }

    body.home-screen .big-start {
      min-height: 60px;
      margin-top: 0;
      border-radius: 13px;
      font-size: 20px;
      box-shadow: 0 8px 18px rgba(37, 99, 235, .20);
    }

    .home-shortcuts,
    .saved-links {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .home-shortcuts .setting-row,
    .saved-links .home-saved-button {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      grid-template-rows: auto auto;
      gap: 2px 10px;
      min-height: 76px;
      margin: 0;
      padding: 12px;
      border: 1px solid #dbe4ef;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: none;
    }

    .home-shortcuts .row-icon,
    .saved-links .row-icon,
    .saved-links .home-saved-button .row-icon {
      grid-column: 1;
      grid-row: 1 / span 2;
      width: 36px;
      height: 36px;
      font-size: 17px;
    }

    .home-shortcuts .row-label,
    .saved-links .row-label {
      grid-column: 2;
      grid-row: 1;
      min-width: 0;
      overflow: hidden;
      font-size: 15px;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .home-shortcuts .row-value,
    .saved-links .home-saved-button small {
      grid-column: 2;
      grid-row: 2;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .home-shortcuts .setting-row:first-child,
    .saved-links .home-saved-button:first-child {
      border-color: #bbf7d0;
      background: #f0fdf4;
    }

    .home-shortcuts .setting-row:last-child,
    .saved-links .home-saved-button:last-child {
      border-color: #fed7aa;
      background: #fff7ed;
    }

    .home-shortcuts .green-icon,
    .saved-links .green-icon {
      background: #22c55e;
      color: #ffffff;
    }

    .home-shortcuts .orange-icon,
    .saved-links .orange-icon {
      background: #f97316;
      color: #ffffff;
    }

    .home-shortcuts .setting-row:first-child .row-label,
    .saved-links .home-saved-button:first-child .row-label {
      color: #166534;
    }

    .home-shortcuts .setting-row:last-child .row-label,
    .saved-links .home-saved-button:last-child .row-label {
      color: #9a3412;
    }

    body.home-screen .sound-card {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 10px;
      margin-top: 12px;
      padding: 12px 0 0;
      border: 0;
      border-top: 1px solid #e3e9f1;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    body.home-screen .sound-card .row-icon {
      width: 30px;
      height: 30px;
      font-size: 14px;
    }

    body.home-screen .sound-card-main {
      display: block;
      min-width: 0;
    }

    body.home-screen .sound-card-head,
    body.home-screen .sound-controls {
      display: flex;
      align-items: center;
    }

    body.home-screen .sound-card-head {
      justify-content: space-between;
      margin-bottom: 6px;
    }

    body.home-screen .sound-controls {
      gap: 8px;
    }

    body.home-screen .sound-test {
      min-height: 36px;
      padding: 6px 10px;
    }

    body.home-screen .sound-hint {
      display: none;
    }

    @media (min-width: 620px) {
      #quick .form-grid,

    const store = {

      combos: 'interval_combos_single_v2',

    const legacyStore = {
      blocks: 'interval_blocks_single_v1',
      combos: 'interval_combos_single_v1'

    const state = {
      blocks: loadArray(store.blocks, loadArray(legacyStore.blocks, [])),

      builder: [],

    $('quickSave').addEventListener('click', quickSave);
    $('menuSave').addEventListener('click', saveMenu);
    $('menuCancelEdit').addEventListener('click', clearMenuEdit);
    el.savedMenuEditToggle.addEventListener('click', toggleSavedMenusEdit);
    $('comboSave').addEventListener('click', saveCombo);
    $('comboStart').addEventListener('click', startBuilder);
    $('comboClear').addEventListener('click', clearComboBuilder);
    $('pause').addEventListener('click', pauseToggle);

    function show(id) {
      const target = $(id);
      if (!target) return;

      if (id !== 'savedMenus' && state.savedMenusEditing) {
        state.savedMenusEditing = false;
        updateSavedMenuEditUI();
        renderSavedMenuPage();
      }

      document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
      target.classList.add('active');

      el.homeBtn.classList.toggle('hidden', id === 'home' || id === 'run');
      document.body.classList.toggle("home-screen", id === "home");
      document.body.classList.toggle("run-screen", id === "run");

      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;

      requestAnimationFrame(() => {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
      });
    }

    function render() {
      el.blockCount.textContent = state.blocks.length;
      el.comboCount.textContent = state.combos.length;
      el.homeSavedMenuCount.textContent = state.blocks.length;
      el.homeSavedComboCount.textContent = state.combos.length;

      renderMenus();
      updateSavedMenuEditUI();
      renderSavedMenuPage();
      renderAvailable();
      renderBuilder();
      renderCombos();
      renderSavedComboPage();
      updateMenuEditUI();
      updateComboEditUI();
      updateComboTotal();
      updateSoundUI();

      saveBlocks();
      saveCombos();
    }

    function blockFromQuick() {
      return {
        id: crypto.randomUUID(),
        name: el.quickName.value.trim() || 'クイック開始',
        work: num(el.quickWork.value, 40, 3600),
        rest: num(el.quickRest.value, 20, 3600),
        repeat: num(el.quickRepeat.value, 8, 100)
      };
    }

    function quickStart() {
      const block = blockFromQuick();
      start([block], block.name);
    }

    function quickSave() {
      state.blocks.push(blockFromQuick());
      saveBlocks();
      render();
      show('savedMenus');
    }

    function menuFormBlock(id = crypto.randomUUID()) {
      return {
        id,
        name: el.menuName.value.trim() || `メニュー ${state.blocks.length + 1}`,
        work: num(el.menuWork.value, 30, 3600),
        rest: num(el.menuRest.value, 15, 3600),
        repeat: num(el.menuRepeat.value, 4, 100)
      };
    }

    function saveMenu() {
      if (state.editingBlockId) {
        const index = state.blocks.findIndex((b) => b.id === state.editingBlockId);
        if (index >= 0) {
          state.blocks[index] = menuFormBlock(state.editingBlockId);
          updateCombosAfterBlockEdit(state.blocks[index]);
        }
        clearMenuEdit(false);
      } else {
        state.blocks.push(menuFormBlock());
        clearMenuForm();
      }

      saveBlocks();
      saveCombos();
      render();
      show('savedMenus');
    }

    function editBlock(id) {
      const block = state.blocks.find((b) => b.id === id);
      if (!block) return;

      state.editingBlockId = id;
      el.menuName.value = block.name;
      el.menuWork.value = block.work;
      el.menuRest.value = block.rest;
      el.menuRepeat.value = block.repeat;

      render();
      show('menu');
    }

    function clearMenuForm() {
      el.menuName.value = '';
      el.menuWork.value = 30;
      el.menuRest.value = 15;
      el.menuRepeat.value = 4;
    }

    function clearMenuEdit(shouldRender = true) {
      state.editingBlockId = null;
      clearMenuForm();
      if (shouldRender) render();
    }

    function updateMenuEditUI() {
      if (state.editingBlockId) {
        const block = state.blocks.find((b) => b.id === state.editingBlockId);
        const title = document.createElement('span');
        title.className = 'edit-title';

        el.menuEditBanner.classList.remove('hidden');

          title,
          document.createTextNode(`${block ? block.name : 'メニュー'} を編集しています。変更後は「変更を保存」を押してください。`)
        );
        el.menuSave.textContent = '変更を保存';
        el.menuCancelEdit.classList.remove('hidden');
      } else {
        el.menuEditBanner.classList.add('hidden');
        el.menuEditBanner.replaceChildren();
        el.menuSave.textContent = '保存';
        el.menuCancelEdit.classList.add('hidden');
      }
    }

    function updateCombosAfterBlockEdit(updatedBlock) {
      if (!updatedBlock) return;

      state.combos = state.combos.map((combo) => ({
        ...combo,
        blocks: combo.blocks.map((block) =>
          block.id === updatedBlock.id ? { ...updatedBlock } : block
        )
      }));

      state.builder = state.builder.map((block) =>
        block.id === updatedBlock.id ? { ...updatedBlock } : block
      );
    }

    function deleteBlock(id) {
      if (!confirm('このメニューを削除しますか？')) return;

      state.blocks = state.blocks.filter((block) => block.id !== id);
      state.builder = state.builder.filter((block) => block.id !== id);

      if (!state.blocks.length) {
        state.savedMenusEditing = false;
      }

      state.combos = state.combos
        .map((combo) => ({
          ...combo,
          blocks: combo.blocks.filter((block) => block.id !== id)
        }))
        .filter((combo) => combo.blocks.length > 0);

      if (state.editingBlockId === id) {
        clearMenuEdit(false);
      }

      saveBlocks();
      saveCombos();
      render();
    }

    function moveSavedMenu(index, direction) {
      const nextIndex = index + direction;
      if (nextIndex < 0 || nextIndex >= state.blocks.length) return;

      const movedId = state.blocks[index].id;

      [state.blocks[index], state.blocks[nextIndex]] =
        [state.blocks[nextIndex], state.blocks[index]];

      saveBlocks();
      render();
      showNotice('並び順を保存しました');

      requestAnimationFrame(() => {
        const handle = el.savedMenuPageList.querySelector(`[data-menu-id="${CSS.escape(movedId)}"] .reorder-handle`);
        handle?.focus();
      });
    }

    function menuCard(block) {
      return card(block.name, [`${block.work}秒 運動`, `${block.rest}秒 休憩`, `${block.repeat}回`], [
        btn('開始', 'blue', () => start([block], block.name), { label: `${block.name}を開始` }),
        btn('内容編集', '', () => editBlock(block.id), { label: `${block.name}の内容を編集` })
      ]);
    }

    function toggleSavedMenusEdit() {
      if (!state.blocks.length) return;
      state.savedMenusEditing = !state.savedMenusEditing;
      updateSavedMenuEditUI();
      renderSavedMenuPage();
    }

    function updateSavedMenuEditUI() {
      if (!state.blocks.length) {
        state.savedMenusEditing = false;
      }

      el.savedMenuEditToggle.disabled = state.blocks.length === 0;
      el.savedMenuEditToggle.textContent = state.savedMenusEditing ? '完了' : '編集';
      el.savedMenuEditToggle.classList.toggle('is-active', state.savedMenusEditing);
      el.savedMenuEditHint.classList.toggle('hidden', !state.savedMenusEditing);
    }

    function savedMenuCard(block) {
      const editing = state.savedMenusEditing;
      const buttons = editing
        ? [
            btn('内容編集', '', () => editBlock(block.id), { label: `${block.name}の内容を編集` }),
            btn('削除', 'red', () => deleteBlock(block.id), { label: `${block.name}を削除` })
          ]
        : [btn('開始', 'blue', () => start([block], block.name), { label: `${block.name}を開始` })];

      const item = card(
        block.name,
        [`${block.work}秒 運動`, `${block.rest}秒 休憩`, `${block.repeat}回`],
        buttons
      );

      item.classList.add('saved-menu-card', editing ? 'editing' : 'normal');

      if (!editing) return item;

      item.classList.add('saved-menu-sortable');
      item.dataset.menuId = block.id;

      const handle = document.createElement('button');
      handle.type = 'button';
      handle.className = 'reorder-handle';
      handle.textContent = '長押しで並び替え';
      handle.setAttribute('aria-label', `${block.name}を長押しして並び替え`);
      item.prepend(handle);
      attachSavedMenuReorder(item, handle, block.id);

      return item;
    }

    function attachSavedMenuReorder(item, handle, menuId) {
      let pressTimer = null;
      let pointerId = null;
      let startX = 0;
      let startY = 0;
      let sorting = false;

      const clearPressTimer = () => {
        clearTimeout(pressTimer);
        pressTimer = null;
      };

      const finishSort = () => {
        clearPressTimer();

        const wasSorting = sorting;
        sorting = false;

        if (pointerId !== null && handle.hasPointerCapture?.(pointerId)) {
          handle.releasePointerCapture(pointerId);
        }

        pointerId = null;

        if (!wasSorting) return;

        item.classList.remove('is-dragging');
        persistSavedMenuOrder();
      };

      handle.addEventListener('click', (event) => event.preventDefault());

      handle.addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
        event.preventDefault();

        const index = state.blocks.findIndex((block) => block.id === menuId);
        moveSavedMenu(index, event.key === 'ArrowUp' ? -1 : 1);
      });

      handle.addEventListener('pointerdown', (event) => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;

        pointerId = event.pointerId;
        startX = event.clientX;
        startY = event.clientY;
        handle.setPointerCapture?.(pointerId);

        pressTimer = setTimeout(() => {
          sorting = true;
          item.classList.add('is-dragging');
          handle.textContent = '上下に動かしてください';
        }, 450);
      });

      handle.addEventListener('pointermove', (event) => {
        if (!sorting) {
          if (Math.hypot(event.clientX - startX, event.clientY - startY) > 10) {
            clearPressTimer();
          }
          return;
        }

        event.preventDefault();

        if (event.clientY < 72) window.scrollBy(0, -8);
        if (event.clientY > window.innerHeight - 72) window.scrollBy(0, 8);

        const target = document
          .elementFromPoint(event.clientX, event.clientY)
          ?.closest('#savedMenuPageList .saved-menu-sortable');

        if (!target || target === item) return;

        const rect = target.getBoundingClientRect();
        const insertBefore = event.clientY < rect.top + rect.height / 2;
        el.savedMenuPageList.insertBefore(item, insertBefore ? target : target.nextSibling);
      });

      handle.addEventListener('pointerup', finishSort);
      handle.addEventListener('pointercancel', finishSort);
      handle.addEventListener('lostpointercapture', finishSort);
    }

    function persistSavedMenuOrder() {
      const ids = [...el.savedMenuPageList.querySelectorAll('.saved-menu-sortable')]
        .map((item) => item.dataset.menuId);

      if (ids.length !== state.blocks.length) {
        renderSavedMenuPage();
        return;
      }

      const blocksById = new Map(state.blocks.map((block) => [block.id, block]));
      state.blocks = ids.map((id) => blocksById.get(id)).filter(Boolean);
      saveBlocks();
      render();
      showNotice('並び順を保存しました');
    }

    function renderMenus() {
      list(el.menuList, state.blocks, 'まだ保存されたメニューはありません。', menuCard);
    }

    function renderSavedMenuPage() {
      el.savedMenuPageList.classList.toggle('editing', state.savedMenusEditing);
      list(el.savedMenuPageList, state.blocks, 'まだ保存されたメニューはありません。', savedMenuCard);
    }

    function renderAvailable() {
      list(el.availableList, state.blocks, '先にメニューを保存してください。', (block) =>
        card(block.name, [`${block.work}秒 Work`, `${block.rest}秒 Rest`, `${block.repeat}回`], [
          btn('追加', 'green', () => addBuilder(block.id), { label: `${block.name}を組み合わせに追加` })
        ])
      );
    }

    function addBuilder(id) {
      const block = state.blocks.find((b) => b.id === id);
      if (!block) return;

      state.builder.push({ ...block });
      render();
      show('combo');
    }

    function renderBuilder() {
      list(el.builderList, state.builder, 'ここにメニューを追加してください。', (block, index) =>
        card(`${index + 1}. ${block.name}`, [`${block.work}秒 Work`, `${block.rest}秒 Rest`, `${block.repeat}回`], [
          btn('↑', '', () => moveBuilder(index, -1), { label: `${block.name}を上へ移動`, disabled: index === 0 }),
          btn('↓', '', () => moveBuilder(index, 1), { label: `${block.name}を下へ移動`, disabled: index === state.builder.length - 1 }),
          btn('削除', 'red', () => {
            state.builder.splice(index, 1);
            render();
          }, { label: `${block.name}を組み合わせから削除` })
        ])
      );
    }

    function moveBuilder(index, direction) {
      const nextIndex = index + direction;
      if (nextIndex < 0 || nextIndex >= state.builder.length) return;

      [state.builder[index], state.builder[nextIndex]] =
        [state.builder[nextIndex], state.builder[index]];

      render();
    }

    function updateComboTotal() {
      const total = state.builder.reduce(
        (sum, block) => sum + (block.work + block.rest) * block.repeat,
        0
      );

      el.comboTotal.innerHTML = `合計 <span>${fmt(total)}</span>`;
    }

    function saveCombo() {
      if (!state.builder.length) {
        alert('組み合わせにメニューを追加してください。');
        return;
      }

      const name = el.comboName.value.trim() || `組み合わせ ${state.combos.length + 1}`;
      const blocks = state.builder.map((block) => ({ ...block }));

      if (state.editingComboId) {
        const combo = state.combos.find((c) => c.id === state.editingComboId);
        if (combo) {
          combo.name = name;
          combo.blocks = blocks;
        }
        clearComboEdit(false);
      } else {
        state.combos.push({
          id: crypto.randomUUID(),
          name,
          blocks
        });
        clearComboBuilder(false);
      }

      saveCombos();
      render();
      show('savedCombos');
    }

    function startBuilder() {
      if (!state.builder.length) {
        alert('組み合わせにメニューを追加してください。');
        return;
      }

      start(state.builder.map((block) => ({ ...block })), el.comboName.value.trim() || '組み合わせ実行');
    }

    function clearComboBuilder(shouldRender = true) {
      state.builder = [];
      state.editingComboId = null;
      el.comboName.value = '';

      if (shouldRender) render();
    }

    function editCombo(id) {
      const combo = state.combos.find((c) => c.id === id);
      if (!combo) return;

      state.editingComboId = id;
      state.builder = combo.blocks.map((block) => ({ ...block }));

      show('combo');
    }

    function loadCombo(id) {
      const combo = state.combos.find((c) => c.id === id);
      if (!combo) return;

      state.editingComboId = null;
      state.builder = combo.blocks.map((block) => ({ ...block }));
      el.comboName.value = combo.name;

      render();
      show('combo');
    }

    function clearComboEdit(shouldRender = true) {
      state.editingComboId = null;
      state.builder = [];
      el.comboName.value = '';

      if (shouldRender) render();
    }

    function deleteCombo(id) {
      if (!confirm('この組み合わせを削除しますか？')) return;

      state.combos = state.combos.filter((combo) => combo.id !== id);

      if (state.editingComboId === id) {
        clearComboEdit(false);
      }

      saveCombos();
      render();
    }

    function updateComboEditUI() {
      if (state.editingComboId) {
        const combo = state.combos.find((c) => c.id === state.editingComboId);
        const title = document.createElement('span');
        title.className = 'edit-title';
        title.textContent = '編集中';

        el.comboEditBanner.classList.remove('hidden');
        el.comboEditBanner.replaceChildren(
          title,
          document.createTextNode(`${combo ? combo.name : '組み合わせ'} を編集しています。変更後は「変更を保存」を押してください。`)
        );
        el.comboSave.textContent = '変更を保存';
      } else {
        el.comboEditBanner.classList.add('hidden');
        el.comboEditBanner.replaceChildren();
        el.comboSave.textContent = '組み合わせを保存';
      }
    }

    function comboCard(combo) {
      const total = combo.blocks.reduce(
        (sum, block) => sum + (block.work + block.rest) * block.repeat,
        0
      );

      return card(combo.name, [`${combo.blocks.length}メニュー`, `合計 ${fmt(total)}`, combo.blocks.map((block) => block.name).join(' / ')], [
        btn('開始', 'blue', () => start(combo.blocks, combo.name), { label: `${combo.name}を開始` }),
        btn('編集', '', () => editCombo(combo.id), { label: `${combo.name}を編集` }),
        btn('読込', '', () => loadCombo(combo.id), { label: `${combo.name}を読み込む` }),
        btn('削除', 'red', () => deleteCombo(combo.id), { label: `${combo.name}を削除` })
      ]);
    }

    function renderCombos() {
      list(el.savedComboList, state.combos, 'まだ保存された組み合わせはありません。', comboCard);
    }

    function renderSavedComboPage() {
      list(el.savedComboPageList, state.combos, 'まだ保存された組み合わせはありません。', comboCard);
    }

    function start(blocks, title) {
      playCue('ready');

      const steps = [
        {
          phase: 'START',
          duration: 5,
          block: '準備',
          round: 0,
          repeat: 0
        }
      ];

      blocks.forEach((block) => {
        for (let i = 0; i < block.repeat; i++) {
          steps.push({
            phase: 'WORK',
            duration: block.work,
            block: block.name,
            round: i + 1,
            repeat: block.repeat
          });

          steps.push({
            phase: 'REST',
            duration: block.rest,
            block: block.name,
            round: i + 1,
            repeat: block.repeat
          });
        }
      });

      clearInterval(state.timer.id);

      state.timer = {
        active: true,
        paused: false,
        title,
        steps,
        index: 0,
        remaining: steps[0].duration,
        duration: steps[0].duration,
        totalLeft: steps.reduce((sum, step) => sum + step.duration, 0),
        id: null,
        beeped: null,
        lastTickAt: performance.now()
      };

      show('run');
      drawRun();
      state.timer.id = setInterval(tick, 250);
      requestWakeLock();
    }

    function tick() {
      const timer = state.timer;

      if (!timer.active || timer.paused) return;

      const now = performance.now();

      if (!Number.isFinite(timer.lastTickAt)) {
        timer.lastTickAt = now;
        return;
      }

      let elapsed = Math.max(0, (now - timer.lastTickAt) / 1000);
      timer.lastTickAt = now;
      let changedStep = false;

      while (timer.active && elapsed >= timer.remaining) {
        elapsed -= timer.remaining;
        timer.totalLeft = Math.max(0, timer.totalLeft - timer.remaining);
        timer.remaining = 0;

        if (!nextStep(false, true)) return;
        changedStep = true;
      }

      if (!timer.active) return;

      timer.remaining = Math.max(0, timer.remaining - elapsed);
      timer.totalLeft = Math.max(0, timer.totalLeft - elapsed);

      if (changedStep) {
        playCurrentPhaseCue();
        if (timer.remaining <= 3) {
          timer.beeped = Math.ceil(timer.remaining);
        }
      }

      const second = Math.ceil(timer.remaining);

      if (second <= 3 && second >= 1 && timer.beeped !== second) {
        playCue('countdown');
        timer.beeped = second;
      }

      drawRun();
    }

    function nextStep(fromSkip = false, silent = false) {
      const timer = state.timer;

      if (!timer.active) return false;

      if (fromSkip && timer.remaining > 0) {
        timer.totalLeft = Math.max(0, timer.totalLeft - timer.remaining);
      }

      timer.index += 1;
      timer.beeped = null;

      if (timer.index >= timer.steps.length) {
        stop(true);
        return false;
      }

      timer.remaining = timer.steps[timer.index].duration;
      timer.duration = timer.steps[timer.index].duration;
      timer.lastTickAt = performance.now();

      if (!silent) {
        playCurrentPhaseCue();
        if (timer.remaining <= 3) {
          timer.beeped = Math.ceil(timer.remaining);
        }
      }

      drawRun();
      return true;
    }

    function pauseToggle() {
      const timer = state.timer;

      if (!timer.active) return;

      if (timer.paused) {
        timer.paused = false;
        timer.lastTickAt = performance.now();
        requestWakeLock();
      } else {
        tick();
        timer.paused = true;
        timer.lastTickAt = null;
        releaseWakeLock();
      }

      el.pause.textContent = timer.paused ? '再開' : '一時停止';
      drawRun();
    }

    function skipStep() {
      if (!state.timer.active) return;
      if (!state.timer.paused) tick();
      nextStep(true);
    }

    function stop(done) {
      if (!done && state.timer.active && !confirm('タイマーを終了しますか？')) return;

      clearInterval(state.timer.id);

      if (done) {
        playCue('complete');
        showNotice('メニューが完了しました');
      }

      state.timer.active = false;
      state.timer.paused = false;
      state.timer.lastTickAt = null;
      el.pause.textContent = '一時停止';
      releaseWakeLock();

      show('home');
      render();
    }

    function drawRun() {
      const timer = state.timer;
      const step = timer.steps[timer.index];

      if (!step) return;

      const isStart = step.phase === 'START';
      const isWork = step.phase === 'WORK';
      const progress = timer.duration
        ? ((timer.duration - timer.remaining) / timer.duration) * 100
        : 100;

      el.runTitle.textContent = timer.title;
      el.blockNameTag.textContent = step.block;
      el.phase.textContent = timer.paused ? '一時停止' : isStart ? '準備' : isWork ? '運動' : '休憩';
      el.phase.style.color = timer.paused
        ? '#64748b'
        : isStart
        ? 'var(--blue)'
        : isWork
          ? 'var(--green)'
          : 'var(--orange)';

      el.time.textContent = fmt(timer.remaining);
      el.step.textContent = isStart ? '準備' : `${step.round} / ${step.repeat}`;
      el.totalLeft.textContent = fmt(timer.totalLeft);
      el.pause.setAttribute('aria-pressed', String(timer.paused));
      el.ring.classList.toggle('is-paused', timer.paused);

      el.ring.style.setProperty('--progress', progress.toFixed(2));
      el.ring.style.setProperty(
        '--phaseColor',
        isStart ? 'var(--blue)' : isWork ? 'var(--green)' : 'var(--orange)'
      );

      const next = timer.steps[timer.index + 1];
      const nextPhase = next?.phase === 'WORK' ? '運動' : next?.phase === 'REST' ? '休憩' : '準備';
      el.next.textContent = next ? `${nextPhase} ${fmt(next.duration)}` : '終了';

      drawUpcomingMenus();
    }

    function drawUpcomingMenus() {
      const root = $('upcomingMenus');

      if (!root) return;

      const timer = state.timer;
      const current = timer.steps[timer.index]?.block;
      const names = [];

      for (let i = timer.index + 1; i < timer.steps.length; i++) {
        const name = timer.steps[i].block;

        if (!name || name === '準備' || name === current) continue;
        if (!names.includes(name)) names.push(name);
      }

      if (!names.length) {
        root.replaceChildren();
        return;
      }

      const title = document.createElement('div');
      title.className = 'upcoming-title';
      title.textContent = '次以降のメニュー';

      const list = document.createElement('div');
      list.className = 'upcoming-list';

      names.forEach((name) => {
        const item = document.createElement('span');
        item.textContent = name;
        list.appendChild(item);
      });

      root.replaceChildren(title, list);
    }

    function updateSoundVolume() {
      state.soundVolume = boundedInt(el.soundVolume.value, 100, 0, 100);
      localStorage.setItem(store.soundVolume, JSON.stringify(state.soundVolume));
      updateSoundUI();

      if (audioEngine) {
        const value = state.soundVolume / 100;
        audioEngine.master.gain.setTargetAtTime(value, audioEngine.ctx.currentTime, 0.01);
      }
    }

    function updateSoundUI() {
      el.soundVolume.value = state.soundVolume;
      el.soundVolumeValue.textContent = state.soundVolume === 0 ? 'ミュート' : `${state.soundVolume}%`;
      el.soundHint.textContent = state.soundVolume === 0
        ? '通知音はミュートされています。'
        : '短い単音の通知音です。端末のメディア音量にも連動します。';
    }

    function testSound() {
      const played = playCue('preview');

      if (!played) {
        el.soundHint.textContent = state.soundVolume === 0
          ? '通知音はミュートされています。'
          : 'この端末では通知音を再生できません。';
      }
    }

    function ensureAudioEngine() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;

      if (!AudioContext) return null;

      if (!audioEngine) {
        let ctx;

        try {
          ctx = new AudioContext({ latencyHint: 'interactive' });
        } catch {
          ctx = new AudioContext();
        }

        const compressor = ctx.createDynamicsCompressor();
        const master = ctx.createGain();

        compressor.threshold.value = -3;
        compressor.knee.value = 0;
        compressor.ratio.value = 20;
        compressor.attack.value = 0.001;
        compressor.release.value = 0.08;
        master.gain.value = state.soundVolume / 100;

        compressor.connect(master);
        master.connect(ctx.destination);
        audioEngine = { ctx, compressor, master };
      }

      const { ctx } = audioEngine;

      if (ctx.state === 'suspended') {
        ctx.resume().catch(() => {});
      }

      return audioEngine;
    }

    function playCue(kind) {
      if (state.soundVolume === 0) return false;

      const engine = ensureAudioEngine();
      if (!engine) return false;

      const cues = {
        ready: { freq: 988, duration: 0.32 },
        preview: { freq: 988, duration: 0.32 },
        countdown: { freq: 988, duration: 0.22 },
        work: { freq: 988, duration: 0.32 },
        rest: { freq: 784, duration: 0.24 },
        complete: { freq: 988, duration: 0.48 }
      };

      scheduleTone(engine, cues[kind] || cues.countdown);
      return true;
    }

    function scheduleTone(engine, tone) {
      const { ctx, compressor } = engine;
      const startAt = ctx.currentTime;
      const endAt = startAt + tone.duration;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.value = tone.freq;
      gain.gain.setValueAtTime(0.0001, startAt);
      gain.gain.exponentialRampToValueAtTime(0.85, startAt + 0.006);
      gain.gain.setValueAtTime(0.85, Math.max(startAt + 0.007, endAt - 0.04));
      gain.gain.exponentialRampToValueAtTime(0.0001, endAt);

      osc.connect(gain);
      gain.connect(compressor);
      osc.start(startAt);
      osc.stop(endAt + 0.03);
    }

    function playCurrentPhaseCue() {
      const phase = state.timer.steps[state.timer.index]?.phase;

      if (phase === 'WORK') {
        playCue('work');
      } else if (phase === 'REST') {
        playCue('rest');
      }
    }

    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) {
        updateWakeStatus('この端末ではスリープ防止を利用できません', 'unsupported');
        return false;
      }

      if (document.visibilityState !== 'visible') {
        updateWakeStatus('画面に戻るとスリープ防止を再開します', 'idle');
        return false;
      }

      try {
        if (screenWakeLock) {
          updateWakeStatus('画面のスリープを防止中', 'active');
          return true;
        }

        updateWakeStatus('スリープ防止を準備中', 'idle');
        const lock = await navigator.wakeLock.request('screen');

        if (!state.timer.active || state.timer.paused) {
          lock.release().catch(() => {});
          updateWakeStatus('一時停止中はスリープを許可します', 'idle');
          return false;
        }

        screenWakeLock = lock;
        updateWakeStatus('画面のスリープを防止中', 'active');
        lock.addEventListener('release', () => {
          if (screenWakeLock === lock) screenWakeLock = null;

          if (!state.timer.active) return;

          if (state.timer.paused) {
            updateWakeStatus('一時停止中はスリープを許可します', 'idle');
          } else if (document.visibilityState !== 'visible') {
            updateWakeStatus('画面に戻るとスリープ防止を再開します', 'idle');
          } else {
            updateWakeStatus('スリープ防止が解除されました', 'unsupported');
          }
        });
        return true;
      } catch {
        screenWakeLock = null;
        updateWakeStatus('この端末ではスリープ防止を利用できません', 'unsupported');
        return false;
      }
    }

    function releaseWakeLock() {
      if (!screenWakeLock) {
        if (state.timer.active && state.timer.paused) {
          updateWakeStatus('一時停止中はスリープを許可します', 'idle');
        }
        return;
      }

      const lock = screenWakeLock;
      screenWakeLock = null;
      lock.release().catch(() => {});

      if (state.timer.active && state.timer.paused) {
        updateWakeStatus('一時停止中はスリープを許可します', 'idle');
      }
    }

    function handleVisibilityChange() {
      if (document.visibilityState === 'visible' && state.timer.active && !state.timer.paused) {
        tick();
        requestWakeLock();
      }
    }

    function updateWakeStatus(message, status) {
      if (!el.wakeStatus) return;
      el.wakeStatus.textContent = message;
      el.wakeStatus.dataset.state = status;
    }

    function showNotice(message) {
      clearTimeout(noticeTimer);
      el.notice.textContent = message;
      el.notice.classList.remove('hidden');

      noticeTimer = setTimeout(() => {
        el.notice.classList.add('hidden');
      }, 3200);
    }

    function list(root, items, emptyText, builder) {
      root.innerHTML = '';

      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = emptyText;
        root.appendChild(empty);
        return;
      }

      items.forEach((item, index) => {
        root.appendChild(builder(item, index));
      });
    }

    function card(title, metrics, buttons) {
      const item = document.createElement('div');
      item.className = 'item';

      const titleEl = document.createElement('div');
      titleEl.className = 'item-title';
      titleEl.textContent = title;
      item.appendChild(titleEl);

      const metricsEl = document.createElement('div');
      metricsEl.className = 'metrics';

      metrics.filter(Boolean).forEach((metric) => {
        const span = document.createElement('span');
        span.textContent = metric;
        metricsEl.appendChild(span);
      });

      item.appendChild(metricsEl);

      const actions = document.createElement('div');
      actions.className = 'small-actions';

      buttons.forEach((button) => {
        actions.appendChild(button);
      });

      item.appendChild(actions);

      return item;
    }

    function btn(text, cls, fn, options = {}) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `small ${cls || ''}`;
      button.textContent = text;
      button.disabled = Boolean(options.disabled);

      if (options.label) {
        button.setAttribute('aria-label', options.label);
      }

      button.addEventListener('click', fn);
      return button;
    }

    function fmt(value) {
      const secondsTotal = Math.max(0, Math.ceil(value));
      const minutes = String(Math.floor(secondsTotal / 60)).padStart(2, '0');
      const seconds = String(secondsTotal % 60).padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function num(value, fallback, max = 3600) {
      const parsed = parseInt(value, 10);
      return Number.isFinite(parsed) && parsed > 0 ? Math.min(parsed, max) : fallback;
    }

    function boundedInt(value, fallback, min, max) {
      const parsed = parseInt(value, 10);
      return Number.isFinite(parsed) ? Math.min(max, Math.max(min, parsed)) : fallback;
    }

    function load(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null) return fallback;

        const value = JSON.parse(raw);
        return value ?? fallback;
      } catch {
        return fallback;
      }
    }

    function loadArray(key, fallback) {
      const value = load(key, fallback);
      return Array.isArray(value) ? value : fallback;
    }

    function saveBlocks() {
      localStorage.setItem(store.blocks, JSON.stringify(state.blocks));
    }

    function saveCombos() {
      localStorage.setItem(store.combos, JSON.stringify(state.combos));
    }
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.log("Service Worker registration failed:", error);
        });
      });
    }
  </script>
